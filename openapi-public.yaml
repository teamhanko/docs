openapi: 3.0.0
info:
  version: '3.0.4'
  title: 'Hanko Public API'
  description: |
    ## Introduction

    This is the OpenAPI specification for the [Hanko Public API](https://github.com/teamhanko/hanko/blob/main/backend/README.md#basic-usage).

    ## Authentication

    The API uses [JSON Web Tokens](https://www.rfc-editor.org/rfc/rfc7519.html) (JWTs) for authentication.
    JWTs are verified using [JSON Web Keys](https://www.rfc-editor.org/rfc/rfc7517) (JWK).
    JWKs can be [configured](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#all-available-config-options)
    through the `secrets.keys` options. The API also publishes public cryptographic keys as a
    [JWK set](https://www.rfc-editor.org/rfc/rfc7517#section-2) through the `.well-known/jwks.json` endpoint
    to enable clients to verify token signatures.
    JWTs must be provided on requests to protected endpoints using one of the following schemes:

    ### CookieAuth

    **Security Scheme Type**: `API Key`

    **Cookie parameter name**: `hanko`

    The JWT must be provided in a Cookie with the name `hanko`.

    ### BearerTokenAuth

    **Security Scheme Type**: `http`

    **HTTP Authorization Scheme**: `Bearer`

    **Bearer format**: `JWT`

    The JWT must be provided in an HTTP Authorization header with bearer type: `Authorization: Bearer <JWT>`.

    ## Cross-Origin Resource Sharing
    Cross-Origin Resource Sharing (CORS) can be currently
    [configured](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#all-available-config-options)
    for public endpoints via the `server.public.cors` options.

    ---

  contact:
    email: developers@hanko.io
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.txt
externalDocs:
  description: More about Hanko
  url: https://github.com/teamhanko/hanko
servers:
  # - url: 'http://localhost:8000'
  - url: "https://{tenant_id}.hanko.io"
    variables:
      tenant_id:
        default: ""
        description: "The (UU)ID of a tenant. Replace the default value with your tenant ID."
paths:
  /:
    get:
      summary: Status page
      description: Return information about the API status. Returns a 500 if there are issues with database connectivity.
      operationId: status
      tags:
        - Status
      responses:
        '200':
          description: 'API is running'
          content:
            text/html:
              schema:
                type: string
        '500':
          description: 'API is not functioning properly'
          content:
            text/html:
              schema:
                type: string
  /.well-known/jwks.json:
    get:
      summary: 'Get JSON Web Key Set'
      description: |
        Retrieve a [JSON Web Key Set](https://www.rfc-editor.org/rfc/rfc7517#section-5) (JWKS) object containing the public `keys` used to verify
        JSON Web Tokens (JWT) issued by the Hanko API and signed using the RS256 signing algorithm.
      operationId: getJwks
      tags:
        - .well-known
      responses:
        '200':
          description: 'JSON Web Key Set'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONWebKeySet'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /saml/metadata:
    get:
      summary: Get SAML Metadata
      description: Download SAML service provider metadata or public certificate.
      operationId: get-saml-metadata
      tags:
        - SAML
      parameters:
        - name: domain
          in: query
          description: Fully qualified domain name to which a SAML service provider is registered
          required: true
          schema:
            type: string
        - name: cert_only
          in: query
          description: Toggle to download the SAML service provider public certificate
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Not found
  /saml/callback:
    post:
      summary: SAML identity provider callback
      description: Callback endpoint called by the identity provider after successful login.
      operationId: post-saml-callback
      tags:
        - SAML
      requestBody:
        description: SAML Identity Provider Response
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                RelayState:
                  type: string
                SAMLResponse:
                  type: string
      responses:
        '302':
          description: Found
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'Contains the JSON Web Token (JWT) that must be provided to protected endpoints.Cookie attributes (e.g. domain) can be set via [configuration](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#hanko-backend-config) option `session.cookie`.'
            X-Auth-Token:
              schema:
                type: string
              description: 'Present only when enabled via [configuration](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#hanko-backend-config) option `session.enable_auth_token_header`for purposes of cross-domain communication between client and Hanko API.'
        '307':
          description: Temporary Redirect
          headers:
            Location:
              schema:
                type: string
              description: 'On error, redirect to the `saml.default_redirect_url` set in the backend-configuration. Error details are provided in the location URL in the form of `error` and `error_description`query params.'
  /sessions/validate:
    get:
      tags:
        - Session Management
      summary: Validate a session
      description: |
        Validate a session using a cookie header or an authorization header.
        This is a passive check that does not update the session's internal last activity timestamp.
      security:
        - CookieAuth: [ ]
        - BearerTokenAuth: [ ]
      responses:
        '200':
          $ref: "#/components/responses/ValidateSessionResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Session Management
      summary: Validate a session
      description: |
        Validate a session using a session token in a request body.
        This endpoint updates the session's internal last activity timestamp. This extends the idle timeout window
        if configured).
      requestBody:
        content:
          application/json:
            schema:
              properties:
                session_token:
                  description: The session token (JWT) to validate
                  type: string
                  format: JWT
              required:
                - session_token
      responses:
        '200':
          $ref: "#/components/responses/ValidateSessionResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: '#/components/responses/InternalServerError'
  /thirdparty/callback:
    get:
      summary: 'Third party provider callback'
      description: Callback endpoint called by the third party provider after successful login.
      operationId: thirdPartyCallback
      tags:
        - Third Party
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: |
            The authorization code that can be exchanged for an access token and to retrieve user provider data
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The state
        - in: query
          name: error
          schema:
            type: string
          description: |
            An error returned from the third party provider
        - in: query
          name: error_description
          schema:
            type: string
          description: The description of the error that occurred (if any)
      responses:
        '307':
          description: 'Redirect to requested redirect URL or to configured site redirect URL'
          headers:
            Location:
              schema:
                type: string
              description: |
                Redirect to the URL requested via `redirect_to` query parameter during third party
                provider login via [`/auth`](#tag/Third-Party/operation/thirdPartyAuth) endpoint on success. On error,
                redirect to the `third_party.error_redirect_url` set in the backend
                [configuration](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#hanko-backend-config).
                Error details are provided in the location URL in the form of `error` and `error_description`
                query params.
            X-Auth-Token:
              description: |
                Present only on successful callback and when enabled via [configuration](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#hanko-backend-config) option `session.enable_auth_token_header`
                for purposes of cross-domain communication between client and Hanko API.
              schema:
                $ref: '#/components/schemas/X-Auth-Token'
            Set-Cookie:
              description: |
                Present only on successful callback. Contains the JSON Web Token (JWT) that must be provided to protected endpoints.
                Cookie attributes (e.g. domain) can be set via [configuration](https://github.com/teamhanko/hanko/blob/main/backend/docs/Config.md#hanko-backend-config) option `session.cookie`.
              schema:
                $ref: '#/components/schemas/CookieSession'
  /me:
    get:
      summary: 'Get the current user'
      description: Retrieve data for the current user (i.e. the subject of the JWT given in a cookie or as a bearer token).
      operationId: IsUserAuthorized
      tags:
        - User Management
      security:
        - CookieAuth: [ ]
        - BearerTokenAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logout:
    post:
      summary: "Log out the current user"
      description: "Logs out the user by removing the authorization cookie."
      operationId: logout
      tags:
        - User Management
      security:
        - CookieAuth: [ ]
        - BearerTokenAuth: [ ]
      responses:
        '204':
          description: 'The user has been logged out'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organizations/roles/check:
    post:
      summary: "Check current user's role"
      description: |
        Checks whether the currently logged-in user (identified by their own session JWT, not a
        {user_id} path param or admin credential) holds at least one of the given roles within an
        organization. If the user is not a member of the organization, or the organization does not
        exist, the result is simply `has_role: false`, not an error.
      operationId: checkOrganizationRole
      tags:
        - Organization Management
      security:
        - CookieAuth: [ ]
        - BearerTokenAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  description: The ID of the organization to check
                  allOf:
                    - $ref: '#/components/schemas/UUID4'
                roles:
                  description: |
                    IDs or slugs of roles to check for. The check succeeds if the user holds at least one
                    of the listed roles (OR semantics).
                  type: array
                  items:
                    type: string
                  minItems: 1
              required:
                - organization_id
                - roles
      responses:
        '200':
          description: Role check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_role:
                    type: boolean
                required:
                  - has_role
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    MeResponse:
      description: Details for the current user
      content:
        application/json:
          schema:
            type: object
            allOf:
              - $ref: '#/components/schemas/UserBase'
              - type: object
                properties:
                  username:
                    $ref: '#/components/schemas/Username'
    ValidateSessionResponse:
      description: Session validation response
      content:
        application/json:
          schema:
            properties:
              is_valid:
                description: Indicates whether the session is valid or not
                type: boolean
              expiration_time:
                description: Date-time indicating the expiration of the session. Deprecated, please use `claims.expiration` instead.
                type: string
                format: date-time
                deprecated: true
              user_id:
                description: The ID of the user the session is associated with. Deprecated, please use `claims.subject` instead.
                type: string
                format: uuid4
                deprecated: true
              claims:
                $ref: '#/components/schemas/JWTClaims'
              idle_expires_at:
                description: |
                  Timestamp (in UTC) indicating when the session will expire due to inactivity, assuming no further activity occurs before this time.
                  Only present when idle timeout is configured. The value is capped to the JWT expiration time.
                type: string
                format: date-time
              organizations:
                description: |
                  The organizations the user belongs to, and the role slugs they hold within each. Computed
                  fresh from the database on every call, not embedded in the JWT, so a role or membership
                  change takes effect immediately on the next validation call rather than only after the
                  session token is reissued. Omitted if the user belongs to no organizations.
                type: array
                items:
                  $ref: '#/components/schemas/ValidateSessionOrganization'
            required:
              - isValid
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Bad Request
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 409
            message: Conflict
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    Gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 410
            message: Gone
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: Internal Server Error
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found
    RequestTimeOut:
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 408
            message: Request Timeout
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 429
            message: Too Many Requests
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Unauthorized
    unprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 422
            message: Unprocessable Entity
  schemas:
    CookieSession:
      type: string
      description: Value `<JWT>` is a [JSON Web Token](https://www.rfc-editor.org/rfc/rfc7519.html)
      example: hanko=<JWT>; Path=/; HttpOnly
    Identity:
      type: object
      description: Representation of a user's third party connection/identity.
      properties:
        id:
          type: string
          description: The ID of the user at the provider
        identity_id:
          type: string
          description: The identity's ID
          format: uuid4
        provider:
          type: string
          description: |
            Contains the display name of the provider, if available. Otherwise contains the provider ID.
    Identities:
      description: The user's third party connections/identities.
      type: array
      items:
        $ref: '#/components/schemas/Identity'
    JSONWebKey:
      type: object
      externalDocs:
        description: RFC7517 - JSON Web Key (JWK)
        url: https://datatracker.ietf.org/doc/html/rfc7517
      properties:
        alg:
          type: string
          example: RS256
          externalDocs:
            description: RFC7517 - JSON Web Key (JWK) - Section 4.4
            url: https://www.rfc-editor.org/rfc/rfc7517#section-4.4
        e:
          type: string
          format: base64url
          example: AQAB
          externalDocs:
            description: RFC7518 - JSON Web Algorithms (JWA) - Section 6.3.1.2
            url: https://www.rfc-editor.org/rfc/rfc7518#section-6.3.1.2
        kid:
          type: string
          example: d6ff37d7-e3d1-4432-ab80-b64faf55ae36
          externalDocs:
            description: RFC7517 - JSON Web Key (JWK) - Section 4.5
            url: https://www.rfc-editor.org/rfc/rfc7517#section-4.5
        kty:
          type: string
          example: RSA
          externalDocs:
            description: RFC7517 - JSON Web Key (JWK) - Section 4.1
            url: https://www.rfc-editor.org/rfc/rfc7517#section-4.1
        'n':
          type: string
          format: base64url
          example: vPFRUCRoxN3RygdJHR3S5BV-DDLw6n-7oUXtX0nr7Twl...
          externalDocs:
            description: RFC7518 - JSON Web Algorithms (JWA) - Section 6.3.1.1
            url: https://www.rfc-editor.org/rfc/rfc7518#section-6.3.1.1
        use:
          type: string
          example: sig
          externalDocs:
            description: RFC7517 - JSON Web Key (JWK) - Section 4.2
            url: https://www.rfc-editor.org/rfc/rfc7517#section-4.2
    JSONWebKeySet:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JSONWebKey'
          externalDocs:
            description: RFC7517 - JSON Web Key (JWK) - Section 5.1
            url: https://www.rfc-editor.org/rfc/rfc7517#section-5.1
      externalDocs:
        description: RFC7517 - JSON Web Key (JWK) - Section 5
        url: https://www.rfc-editor.org/rfc/rfc7517#section-5
    JWTClaims:
      type: object
      description: "The claims extracted from a JWT."
      properties:
        subject:
          description: "The unique identifier of the token's subject."
          allOf:
            - $ref: '#/components/schemas/UUID4'
        issued_at:
          description: "The timestamp indicating when the token was issued."
          type: string
          format: date-time
        expiration:
          description: "The timestamp indicating when the token will expire."
          type: string
          format: date-time
        audience:
          description: "The intended audience of the token."
          type: array
          items:
            type: string
        issuer:
          description: "The entity that issued the token."
          type: string
        email:
          description: "Data about the email address associated with the token's subject, if available."
          type: object
          properties:
            address:
              description: "The actual email address."
              type: string
              format: email
            is_primary:
              description: "Indicates whether the email address is the primary address."
              type: boolean
            is_verified:
              description: "Indicates whether the email address is verified."
              type: boolean
        session_id:
          description: "The unique identifier for the session associated with this token."
          allOf:
            - $ref: '#/components/schemas/UUID4'
        amr:
          description: Authentication Method References, JSON array of strings that are identifiers for authentication methods used in the authentication.
          type: array
          items:
            type: string
            enum:
              - pwd
              - passkey
              - otp
              - ext:<provider>
              - totp
              - security_key
            description: |
              - `pwd` => password
              - `passkey` => passkey
              - `otp` => email passcode
              - `ext:<provider>` => thirdparty provider, where <provider> is the internal provider ID, e.g. `ext:microsoft`
              - `totp` => 2FA authenticator app
              - `security_key` => 2FA security key
      required:
        - subject
        - expiration
        - session_id
    UserBase:
      type: object
      properties:
        id:
          description: The ID of the user. Deprecated, use `user_id` instead.
          deprecated: true
          allOf:
            - $ref: '#/components/schemas/UUID4'
        user_id:
          description: The ID of the user
          allOf:
            - $ref: '#/components/schemas/UUID4'
        emails:
          $ref: '#/components/schemas/Emails'
        created_at:
          description: Time of creation of the the user
          type: string
          format: date-time
        updated_at:
          description: Time of last update of the user
          type: string
          format: date-time
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/WebauthnCredential"
          example:
            - id: "5333cc5b-c7c4-48cf-8248-9c184ac72b65"
              name: "iCloud"
              public_key: "pQECYyagASFYIBblARCP_at3cmprjzQN1lJ..."
              attestation_type: "packed"
              aaguid: "01020304-0506-0708-0102-030405060708"
              last_used_at: "2026-02-24T21:40:36.26936Z"
              created_at: "2026-02-24T21:40:36.26936Z"
              transports: [
                "internal"
              ]
              backup_eligible: true
              backup_state: true
              mfa_only: false
        security_keys:
          type: array
          items:
            $ref: "#/components/schemas/WebauthnCredential"
          example:
            - id: "f826013e-e7e3-4366-a6d8-9359effc8cdd"
              name: "Yubikey Bio"
              public_key: "aNMEEyadASFYIBblARCP_at3cmp4gg3zQN1lJ..."
              attestation_type: "packed"
              aaguid: "90636e1f-ef82-43bf-bdcf-5255f139d12f"
              last_used_at: "2026-02-24T21:40:36.26936Z"
              created_at: "2026-02-24T21:40:36.26936Z"
              transports: [
                "usb"
              ]
              backup_eligible: true
              backup_state: false
              mfa_only: true
        metadata:
          $ref: "#/components/schemas/UserMetadata"
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        picture:
          type: string
          format: uri
        mfa_config:
          type: object
          properties:
            auth_app_set_up:
              type: boolean
            totp_enabled:
              type: boolean
            security_key_enabled:
              type: boolean
    UserMetadata:
      description: The public and unsafe metadata of a user
      type: object
      properties:
        public_metadata:
          type: object
          additionalProperties: true
          example:
            role: admin
        unsafe_metadata:
          type: object
          additionalProperties: true
          example:
            birthday: "2025-05-12"
    Username:
      description: The representation of a username of the user
      type: object
      properties:
        id:
          description: The ID of the user
          allOf:
            - $ref: '#/components/schemas/UUID4'
        created_at:
          description: Time of creation of the username
          type: string
          format: date-time
        updated_at:
          description: Time of last update of the username
          type: string
          format: date-time
        username:
          description: The username of the user
          type: string
          example: john_doe
    Emails:
      type: array
      items:
        type: object
        properties:
          id:
            description: The ID of the email address
            allOf:
              - $ref: '#/components/schemas/UUID4'
          address:
            description: The email address
            type: string
            format: email
          is_verified:
            description: Indicated the email has been verified.
            type: boolean
          is_primary:
            description: Indicates it's the primary email address.
            type: boolean
          identity:
            allOf:
              - $ref: '#/components/schemas/Identity'
              - deprecated: true
              - description: Deprecated, use `user.identities` instead.
          identities:
            allOf:
              - $ref: '#/components/schemas/Identities'
              - deprecated: true
              - description: Deprecated, use `user.identities` instead.
      example:
        - id: 5333cc5b-c7c4-48cf-8248-9c184ac72b65
          address: john.doe@example.com
          is_verified: true
          is_primary: false
    WebauthnCredential:
      type: object
      properties:
        aaguid:
          type: string
          format: uuid
        attestation_type:
          type: string
          enum:
            - none
            - packed
            - tpm
            - android-key
            - android-safetynet
            - fido-u2f
            - apple
        backup_eligible:
          type: boolean
        backup_state:
          type: boolean
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_used_at:
          type: string
          format: date-time
        mfa_only:
          type: boolean
        name:
          type: string
        public-key:
          type: string
        transports:
          type: array
          items:
            type: string
            enum:
              - ble
              - internal
              - nfc
              - usb
    WebauthnCredentials:
      description: 'A list of WebAuthn credentials'
      type: array
      items:
        $ref: '#/components/schemas/WebauthnCredential'
